[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = false
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[fuzz]
runs = 256

[invariant]
runs = 64
depth = 32
fail_on_revert = false

[rpc_endpoints]
local = "${LOCAL_RPC_URL:-http://127.0.0.1:8545}"
fuji = "${FUJI_RPC_URL:-https://api.avax-test.network/ext/bc/C/rpc}"
