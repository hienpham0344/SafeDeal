spring:
  datasource:
    url: jdbc:h2:mem:safedeal_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate

safedeal:
  blockchain:
    enabled: false
    chain-id: 31337
    chain-name: Anvil Local
    rpc-url: http://127.0.0.1:8545
    escrow-contract-address: "0x5fbdb2315678afecb367f032d93f642f64180aa3"
    deployment-block: 0
    confirmations-required: 1
    poll-interval-ms: 600000
  auth:
    jwt-secret: "test-only-ephemeral-hmac-secret-minimum-32-bytes-length"
    session-ttl-seconds: 3600
    nonce-ttl-seconds: 300
    siwe-domain: "localhost:5173"
    siwe-uri: "http://localhost:5173"
    cookie-secure: false
    cookie-same-site: Lax
  cors:
    allowed-origins: "http://localhost:5173"
  evidence:
    storage-dir: "${java.io.tmpdir}/safedeal-test-evidence"
    max-bytes: 5242880
  rate-limit:
    enabled: false
    auth-requests-per-minute: 100
