spring:
  application:
    name: safedeal-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: ${DB_DRIVER_CLASS_NAME:org.postgresql.Driver}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: ${EVIDENCE_MAX_BYTES:5242880}
      max-request-size: ${EVIDENCE_MAX_REQUEST_BYTES:6291456}

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

safedeal:
  blockchain:
    enabled: ${BLOCKCHAIN_SYNC_ENABLED:true}
    chain-id: ${CHAIN_ID:31337}
    chain-name: ${CHAIN_NAME:Anvil Local}
    rpc-url: ${AVALANCHE_RPC_URL:http://127.0.0.1:8545}
    escrow-contract-address: ${ESCROW_CONTRACT_ADDRESS:}
    deployment-block: ${ESCROW_DEPLOYMENT_BLOCK:0}
    confirmations-required: ${BLOCKCHAIN_CONFIRMATIONS_REQUIRED:1}
    sync-batch-size: ${BLOCKCHAIN_SYNC_BATCH_SIZE:1000}
    poll-interval-ms: ${BLOCKCHAIN_POLL_INTERVAL_MS:10000}
    rpc-timeout-ms: ${BLOCKCHAIN_RPC_TIMEOUT_MS:10000}
  auth:
    jwt-secret: ${JWT_SECRET}
    session-ttl-seconds: ${SESSION_TTL_SECONDS:86400}
    nonce-ttl-seconds: ${NONCE_TTL_SECONDS:300}
    siwe-domain: ${SIWE_DOMAIN:localhost:5173}
    siwe-uri: ${SIWE_URI:http://localhost:5173}
    session-cookie-name: ${SESSION_COOKIE_NAME:safedeal_session}
    csrf-cookie-name: ${CSRF_COOKIE_NAME:safedeal_csrf}
    cookie-secure: ${COOKIE_SECURE:false}
    cookie-same-site: ${COOKIE_SAME_SITE:Lax}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  evidence:
    storage-dir: ${EVIDENCE_STORAGE_DIR:./storage/evidence}
    max-bytes: ${EVIDENCE_MAX_BYTES:5242880}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    auth-requests-per-minute: ${AUTH_RATE_LIMIT_PER_MINUTE:30}
