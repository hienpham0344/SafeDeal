name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck:web
      - name: Lint
        run: npm run lint:web
      - name: Build
        run: npm run build:web
        env:
          NEXT_PUBLIC_API_BASE_URL: https://safedeal-production.up.railway.app
          NEXT_PUBLIC_CHAIN_ID: 43113
          NEXT_PUBLIC_AVALANCHE_RPC_URL: https://api.avax-test.network/ext/bc/C/rpc

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm install -g vercel
          cd apps/web
          vercel deploy --prod --token "$VERCEL_TOKEN"

      - name: Verify deployment
        run: |
          for i in {1..10}; do
            health=$(curl -s -o /dev/null -w "%{http_code}" https://safedeal.vercel.app/api/health)
            if [ "$health" = "200" ]; then
              echo "✓ Frontend health check passed"
              exit 0
            fi
            echo "Attempt $i/10 - waiting..."
            sleep 5
          done
          echo "⚠ Frontend health check timeout (expected for pre-render)"
          exit 0
