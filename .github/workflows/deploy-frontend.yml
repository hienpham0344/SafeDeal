name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install, check, and build
        working-directory: frontend
        env:
          VITE_APP_NAME: ${{ vars.VITE_APP_NAME || 'SafeDeal' }}
          VITE_APP_ENV: ${{ vars.VITE_APP_ENV || 'production' }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_CHAIN_ID: ${{ vars.VITE_CHAIN_ID || '43113' }}
          VITE_CHAIN_NAME: ${{ vars.VITE_CHAIN_NAME || 'Avalanche Fuji C-Chain' }}
          VITE_RPC_URL: ${{ vars.VITE_RPC_URL || 'https://api.avax-test.network/ext/bc/C/rpc' }}
          VITE_EXPLORER_BASE_URL: ${{ vars.VITE_EXPLORER_BASE_URL || 'https://testnet.snowtrace.io' }}
          VITE_ESCROW_CONTRACT_ADDRESS: ${{ vars.VITE_ESCROW_CONTRACT_ADDRESS }}
          VITE_DEFAULT_ARBITER_ADDRESS: ${{ vars.VITE_DEFAULT_ARBITER_ADDRESS }}
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm test
          npm run build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Deploy frontend to Vercel
        working-directory: frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm install -g vercel
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
