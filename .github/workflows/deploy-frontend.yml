name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install, check, and build
        working-directory: frontend
        env:
          VITE_APP_NAME: ${{ vars.VITE_APP_NAME || 'SafeDeal' }}
          VITE_APP_ENV: ${{ vars.VITE_APP_ENV || 'production' }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_CHAIN_ID: ${{ vars.VITE_CHAIN_ID || '43113' }}
          VITE_CHAIN_NAME: ${{ vars.VITE_CHAIN_NAME || 'Avalanche Fuji C-Chain' }}
          VITE_RPC_URL: ${{ vars.VITE_RPC_URL || 'https://api.avax-test.network/ext/bc/C/rpc' }}
          VITE_EXPLORER_BASE_URL: ${{ vars.VITE_EXPLORER_BASE_URL || 'https://testnet.snowtrace.io' }}
          VITE_ESCROW_CONTRACT_ADDRESS: ${{ vars.VITE_ESCROW_CONTRACT_ADDRESS }}
          VITE_DEFAULT_ARBITER_ADDRESS: ${{ vars.VITE_DEFAULT_ARBITER_ADDRESS }}
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm test
          npm run build

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          npx firebase-tools deploy --only hosting --token "$FIREBASE_TOKEN" --non-interactive
