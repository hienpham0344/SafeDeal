name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        default: production
        type: choice
        options:
          - production
          - staging

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run tests
        run: cd apps/api && ./mvnw -B clean test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          npm install -g @railway/cli
          cd apps/api
          railway up --force

      - name: Verify deployment
        run: |
          set +e
          for i in {1..30}; do
            health=$(curl -s -o /dev/null -w "%{http_code}" https://safedeal-production.up.railway.app/api/v1/health)
            if [ "$health" = "200" ]; then
              echo "✓ Backend health check passed"
              exit 0
            fi
            echo "Attempt $i/30 - Status: $health, waiting..."
            sleep 10
          done
          echo "✗ Health check failed"
          exit 1

      - name: Notify on failure
        if: failure()
        run: echo "Deployment failed. Check Railway logs."
