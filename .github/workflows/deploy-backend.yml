name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: safedeal_test
          POSTGRES_USER: safedeal
          POSTGRES_PASSWORD: safedeal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U safedeal -d safedeal_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.9.0
      - name: Install Solidity dependencies if missing
        working-directory: blockchain
        run: |
          if [ ! -d lib/forge-std ] || [ ! -d lib/openzeppelin-contracts ]; then
            forge install foundry-rs/forge-std OpenZeppelin/openzeppelin-contracts --no-git
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Ensure cmake is installed
        run: command -v cmake >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y cmake)
      - name: Run Rust backend tests & build release binary
        env:
          SAFEDEAL_TEST_DB_URL: postgres://safedeal:safedeal@127.0.0.1:5432/safedeal_test
        run: |
          cargo fmt --manifest-path backend/Cargo.toml --check
          cargo clippy --manifest-path backend/Cargo.toml --workspace --all-targets -- -D warnings
          cargo test --manifest-path backend/Cargo.toml --workspace -- --test-threads=1
          cargo build --release --manifest-path backend/Cargo.toml --bin safedeal-api

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Deploy backend to Railway
        working-directory: backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          npm install -g @railway/cli
          railway up --detach

      - name: Verify live healthcheck if configured
        env:
          BACKEND_HEALTH_URL: ${{ vars.BACKEND_HEALTH_URL }}
        run: |
          if [ -z "$BACKEND_HEALTH_URL" ]; then
            echo "BACKEND_HEALTH_URL repository variable not set; skipping remote probe."
            exit 0
          fi
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$BACKEND_HEALTH_URL")
            if [ "$code" = "200" ]; then
              echo "Backend health check passed ($BACKEND_HEALTH_URL)"
              exit 0
            fi
            sleep 10
          done
          echo "Backend health check failed after retries" >&2
          exit 1
