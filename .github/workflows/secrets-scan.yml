name: Secrets Scan

on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    - cron: "0 0 * * 0"  # Weekly scan

permissions:
  contents: read
  security-events: write

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Include root commit in initial push scan
        if: github.event_name == 'push'
        env:
          FIRST_COMMIT: ${{ github.event.commits[0].id }}
          LAST_COMMIT: ${{ github.sha }}
        run: |
          if [ -n "$FIRST_COMMIT" ] && ! git rev-parse --verify "${FIRST_COMMIT}^" >/dev/null 2>&1; then
            echo "BASE_REF=$LAST_COMMIT" >> "$GITHUB_ENV"
          fi

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: true

      - name: Scan full push history
        if: github.event_name == 'push'
        run: gitleaks detect --redact -v --exit-code=2 --log-opts="$GITHUB_SHA"

      - name: Report findings
        if: failure()
        run: echo "Secrets detected. Review Gitleaks output and remove before merging."
