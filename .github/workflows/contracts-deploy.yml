name: Deploy Contracts (Manual)

on:
  workflow_dispatch:
    inputs:
      network:
        description: "Target network"
        required: true
        default: fuji
        type: choice
        options:
          - fuji

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: testnet
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.9.0

      - name: Install Solidity dependencies if missing
        working-directory: blockchain
        run: |
          if [ ! -d lib/forge-std ] || [ ! -d lib/openzeppelin-contracts ]; then
            forge install foundry-rs/forge-std OpenZeppelin/openzeppelin-contracts --no-git
          fi

      - name: Verify contracts before deploy
        run: forge test --root blockchain -vvv

      - name: Deploy SafeDealEscrow via Foundry
        working-directory: blockchain
        env:
          FUJI_RPC_URL: ${{ vars.FUJI_RPC_URL || 'https://api.avax-test.network/ext/bc/C/rpc' }}
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          SNOWTRACE_API_KEY: ${{ secrets.SNOWTRACE_API_KEY }}
        run: |
          if [ -z "$DEPLOYER_PRIVATE_KEY" ]; then
            echo "DEPLOYER_PRIVATE_KEY secret is required" >&2
            exit 1
          fi
          VERIFY_FLAG=""
          if [ -n "$SNOWTRACE_API_KEY" ]; then
            VERIFY_FLAG="--verify --etherscan-api-key $SNOWTRACE_API_KEY"
          fi
          forge script script/Deploy.s.sol:Deploy --rpc-url "$FUJI_RPC_URL" --broadcast $VERIFY_FLAG

      - name: Upload broadcast receipts
        uses: actions/upload-artifact@v4
        with:
          name: fuji-broadcast
          path: blockchain/broadcast/
