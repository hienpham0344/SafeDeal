name: Deploy Contracts (Manual)

on:
  workflow_dispatch:
    inputs:
      network:
        description: "Target network"
        required: true
        default: fuji
        type: choice
        options:
          - fuji

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: testnet
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.9.0

      - name: Install Solidity dependencies if missing
        working-directory: blockchain
        run: |
          if [ ! -d lib/forge-std ] || [ ! -d lib/openzeppelin-contracts ]; then
            forge install foundry-rs/forge-std OpenZeppelin/openzeppelin-contracts --no-git
          fi

      - name: Verify contracts before deploy
        run: forge test --root blockchain -vvv

      - name: Deploy and dual-verify SafeDealEscrow via Foundry
        working-directory: blockchain
        env:
          FUJI_RPC_URL: ${{ vars.FUJI_RPC_URL || 'https://api.avax-test.network/ext/bc/C/rpc' }}
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          SNOWTRACE_API_KEY: ${{ secrets.SNOWTRACE_API_KEY }}
        run: |
          if [ -z "$DEPLOYER_PRIVATE_KEY" ]; then
            echo "DEPLOYER_PRIVATE_KEY secret is required" >&2
            exit 1
          fi
          API_KEY="${SNOWTRACE_API_KEY:-verifyContract}"
          ROUTESCAN_URL="https://api.routescan.io/v2/network/testnet/evm/43113/etherscan/api"

          forge script script/Deploy.s.sol:Deploy --rpc-url "$FUJI_RPC_URL" --broadcast

          DEPLOYED_ADDRESS=$(jq -r '.transactions[] | select(.contractName == "SafeDealEscrow") | .contractAddress' broadcast/Deploy.s.sol/43113/run-latest.json | head -n 1)
          if [ -z "$DEPLOYED_ADDRESS" ] || [ "$DEPLOYED_ADDRESS" = "null" ]; then
            echo "Failed to extract deployed SafeDealEscrow address from broadcast receipt" >&2
            exit 1
          fi

          forge verify-contract "$DEPLOYED_ADDRESS" src/SafeDealEscrow.sol:SafeDealEscrow \
            --chain-id 43113 \
            --verifier custom \
            --verifier-url "$ROUTESCAN_URL" \
            --verifier-api-key "$API_KEY" \
            --watch

          forge verify-contract "$DEPLOYED_ADDRESS" src/SafeDealEscrow.sol:SafeDealEscrow \
            --chain-id 43113 \
            --verifier sourcify \
            --watch

      - name: Upload broadcast receipts
        uses: actions/upload-artifact@v4
        with:
          name: fuji-broadcast
          path: blockchain/broadcast/
