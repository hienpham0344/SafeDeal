# Test profile: in-memory PostgreSQL-compatible database so the build needs no external services.
spring:
  datasource:
    url: jdbc:h2:mem:safedeal;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

safedeal:
  cors:
    allowed-origins: http://localhost:3000
  ai:
    provider: mock
  blockchain:
    rpc-url: http://localhost:8545
    chain-id: 43113
    contracts: {}
