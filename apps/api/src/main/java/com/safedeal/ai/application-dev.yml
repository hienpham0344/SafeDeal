# Development profile. Point DB_* at a local PostgreSQL or a Railway development database.
# Credentials always come from the environment; there are no defaults for secrets.
spring:
  datasource:
    url: ${DATABASE_JDBC_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:safedeal}}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
  jpa:
    show-sql: false

logging:
  level:
    com.safedeal: DEBUG
