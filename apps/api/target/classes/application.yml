spring:
  application:
    name: safedeal-api
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

safedeal:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  ai:
    provider: ${AI_PROVIDER:mock}
    endpoint: ${AI_API_ENDPOINT:}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:}
  blockchain:
    network: AVALANCHE_FUJI
    rpc-url: ${AVALANCHE_RPC_URL:https://api.avax-test.network/ext/bc/C/rpc}
    chain-id: ${AVALANCHE_CHAIN_ID:43113}
    confirmations: ${BLOCKCHAIN_CONFIRMATIONS:2}
    contracts:
      escrow-manager: ${ESCROW_MANAGER_ADDRESS:}
      subscription-manager: ${SUBSCRIPTION_MANAGER_ADDRESS:}
      dispute-resolver: ${DISPUTE_RESOLVER_ADDRESS:}
      payment-token: ${PAYMENT_TOKEN_ADDRESS:}
